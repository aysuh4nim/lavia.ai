<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavia ile Sohbet</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      canvas {
        display: block;
      }

      /* Chat Bubble */
      .chat-bubble {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px 30px;
        border-radius: 20px;
        font-size: 18px;
        max-width: 70%;
        text-align: center;
        font-family: 'Segoe UI', sans-serif;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
      }

      /* Subtitle Text */
      .subtitle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.85);
        color: #31abc9;
        padding: 15px 30px;
        border-radius: 15px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        max-width: 80%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      .subtitle.visible {
        opacity: 1;
      }

      /* Microphone Button */
      #micButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px;
        font-size: 28px;
        border: none;
        border-radius: 50%;
        background: #31abc9;
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(49, 171, 201, 0.4);
        transition: all 0.3s ease;
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #micButton:hover {
        background: #2499b2;
        transform: translateX(-50%) scale(1.1);
      }

      #micButton.listening {
        background: #e74c3c;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 4px 16px rgba(231, 76, 60, 0.4);
        }
        50% {
          box-shadow: 0 4px 32px rgba(231, 76, 60, 0.8);
        }
      }

      .powered-by {
        position: absolute;
        bottom: 10px;
        right: 10px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
      }
      /* WhatsApp floating button */
      .whatsapp-fab {
        position: fixed;
        right: 18px;
        bottom: 50px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #ffffff; /* lavanta tonları */
        box-shadow: 0 8px 24px rgba(127, 91, 216, 0.36);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 50px;
        text-decoration: none;
        z-index: 9999;
      }
      .whatsapp-fab:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 26px rgba(127, 91, 216, 0.46);
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
        }
      }
    </script>
  </head>

  <body class="chat-page">
    <div class="chat-container">
      <canvas id="laviaCanvas"></canvas>
      <div class="chat-bubble" id="chatBubble">
        Merhaba! Konuşmak için mikrofon simgesine bas.<br />
        Powered By
        <a
          target="_blank"
          style="color: #31abc9; text-decoration: none"
          href="https://supx.ai"
          >supx.ai</a
        >
      </div>
      <div class="subtitle" id="subtitle"></div>
      <button id="micButton">🎙️</button>
      <div class="powered-by">powered by supx.ai</div>
      <!-- WhatsApp hızlı erişim düğmesi -->
      <a
        class="whatsapp-fab"
        id="whatsappFab"
        href="https://wa.me/905541477094?text=Merhaba%20Lavia!"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp ile iletişime geç"
      >
        🪻
      </a>
    </div>

    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

      // Canvas ve Scene ayarları
      const canvas = document.getElementById('laviaCanvas')
      const scene = new THREE.Scene()

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      )
      camera.position.set(0, 1.6, 3)

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
      })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setPixelRatio(window.devicePixelRatio)

      // Işık ekleme
      const light = new THREE.DirectionalLight(0xffffff, 1)
      light.position.set(0, 5, 5)
      scene.add(light)

      const ambient = new THREE.AmbientLight(0x404040, 2)
      scene.add(ambient)

      // Ağız animasyonu için değişkenler
      let laviaModel = null
      let mouthMorphTarget = null
      let isSpeaking = false
      let mouthOpenAmount = 0
      let targetMouthOpen = 0

      // Lavia modelini yükleme
      const loader = new GLTFLoader()
      loader.load(
        './lavia/laviaModel.glb',
        function (gltf) {
          console.log('✅ Lavia modeli yüklendi:', gltf)
          laviaModel = gltf.scene
          gltf.scene.position.y = 0.9
          scene.add(gltf.scene)

          // Ağız morph target'ını bul
          gltf.scene.traverse(child => {
            if (child.isMesh && child.morphTargetInfluences) {
              console.log('Mesh bulundu:', child.name)
              console.log('Morph targets:', child.morphTargetDictionary)

              // Ağız ile ilgili morph target'ları ara
              if (child.morphTargetDictionary) {
                const mouthTargets = [
                  'mouth',
                  'Mouth',
                  'jaw',
                  'Jaw',
                  'viseme',
                  'Viseme'
                ]
                for (let target of mouthTargets) {
                  if (child.morphTargetDictionary[target] !== undefined) {
                    mouthMorphTarget = {
                      mesh: child,
                      index: child.morphTargetDictionary[target]
                    }
                    console.log('✅ Ağız morph target bulundu:', target)
                    break
                  }
                }
              }
            }
          })

          if (!mouthMorphTarget) {
            console.log(
              '⚠️ Ağız morph target bulunamadı, basit animasyon kullanılacak'
            )
          }
        },
        function (xhr) {
          console.log(
            `Yükleniyor: ${Math.round((xhr.loaded / xhr.total) * 100)}%`
          )
        },
        function (error) {
          console.error('❌ Lavia modeli yüklenemedi:', error)
        }
      )

      // Ağız animasyonu fonksiyonu
      function animateMouth() {
        if (isSpeaking) {
          // Konuşurken rastgele ağız hareketi
          targetMouthOpen = 0.3 + Math.random() * 0.5
        } else {
          targetMouthOpen = 0
        }

        // Yumuşak geçiş
        mouthOpenAmount += (targetMouthOpen - mouthOpenAmount) * 0.3

        // Morph target varsa kullan
        if (mouthMorphTarget && mouthMorphTarget.mesh.morphTargetInfluences) {
          mouthMorphTarget.mesh.morphTargetInfluences[mouthMorphTarget.index] =
            mouthOpenAmount
        } else if (laviaModel) {
          // Morph target yoksa basit ölçeklendirme animasyonu
          laviaModel.traverse(child => {
            if (child.isMesh && child.name.toLowerCase().includes('jaw')) {
              child.rotation.x = -mouthOpenAmount * 0.3
            }
          })
        }
      }

      // Animasyon fonksiyonu
      function animate() {
        requestAnimationFrame(animate)
        animateMouth() // Ağız animasyonunu her frame'de güncelle
        renderer.render(scene, camera)
      }
      animate()

      // Pencere boyutu değişirse, renderer'ı ve kamerayı ayarla
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // Ses tanıma değişkenleri
      const micButton = document.getElementById('micButton')
      const chatBubble = document.getElementById('chatBubble')
      const subtitle = document.getElementById('subtitle')
      let recognition = null
      let isListening = false

      // Ses tanıma desteği kontrolü
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition

      if (!SpeechRecognition) {
        chatBubble.innerHTML =
          '⚠️ Bu tarayıcı ses tanımayı desteklemiyor!<br>Lütfen Chrome veya Edge kullanın.'
        micButton.disabled = true
        micButton.style.opacity = '0.5'
      }

      // Mikrofon butonu tıklama
      micButton.onclick = () => {
        if (isListening) {
          stopListening()
        } else {
          startListening()
        }
      }

      function startListening() {
        if (!SpeechRecognition) return

        recognition = new SpeechRecognition()
        recognition.lang = 'tr-TR'
        recognition.continuous = false
        recognition.interimResults = false
        recognition.maxAlternatives = 1

        recognition.onstart = () => {
          isListening = true
          micButton.classList.add('listening')
          micButton.textContent = '🔴'
          chatBubble.textContent = '🎤 Dinliyorum... Konuşabilirsiniz!'
          console.log('Ses tanıma başladı')
        }

        recognition.onresult = async event => {
          const transcript = event.results[0][0].transcript
          const confidence = event.results[0][0].confidence

          console.log('Algılanan metin:', transcript)
          console.log('Güven skoru:', confidence)

          chatBubble.textContent = `Sen: "${transcript}"`

          // API'ye gönder
          await sendToServer(transcript)
        }

        recognition.onerror = event => {
          console.error('Ses tanıma hatası:', event.error)
          let errorMessage = 'Bir hata oluştu!'

          switch (event.error) {
            case 'no-speech':
              errorMessage = 'Ses algılanamadı. Lütfen tekrar deneyin.'
              break
            case 'audio-capture':
              errorMessage = 'Mikrofon erişimi sağlanamadı!'
              break
            case 'not-allowed':
              errorMessage = 'Mikrofon izni reddedildi!'
              break
            case 'network':
              errorMessage = 'Ağ hatası oluştu!'
              break
          }

          chatBubble.textContent = `❌ ${errorMessage}`
          stopListening()
        }

        recognition.onend = () => {
          console.log('Ses tanıma sonlandı')
          stopListening()
        }

        try {
          recognition.start()
        } catch (error) {
          console.error('Ses tanıma başlatılamadı:', error)
          chatBubble.textContent = '❌ Ses tanıma başlatılamadı!'
          stopListening()
        }
      }

      function stopListening() {
        isListening = false
        micButton.classList.remove('listening')
        micButton.textContent = '🎙️'

        if (recognition) {
          try {
            recognition.stop()
          } catch (error) {
            console.log('Recognition zaten durmuş')
          }
          recognition = null
        }
      }

      async function sendToServer(text) {
        try {
          chatBubble.textContent = '⏳ Cevap bekleniyor...'
          console.log("API'ye gönderilen metin:", text)

          const response = await fetch(
            'https://us-central1-supx-30216.cloudfunctions.net/n_answerCustomer',
            {
              // Supx.ai api URL'si
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                assistantId: 'T31hPKcFzUcDyakrIpVZJvPzjZ92', // asistan ID'si DEĞİŞTİRME!!!
                userId: 'T31hPKcFzUcDyakrIpVZJvPzjZ92', // Kullanıcı ID'si DEĞİŞTİRME!!!
                threadId: 'AYSUHANIM', // Konuşma geçmişi için thread ID'si asistanın hafızasının sıfırlanmasını istiyorsan değiştir!!!
                message: text, // Gönderilen metin
                type: 'web'
                // AŞAĞIDA VERDİĞİM LİNK VE GİRİŞ BİLGİLERİNİ KULLANARAK SUPX.Aİ ÜZERİNDE BU ASİSTANI EĞİTEBİLİRSİN
                // https://supx.ai/login
                // email : beratbeywinchester@gmail.com şifre: 123123
                // https://supx.ai/dashboard adresinden asistanını konuşarak eğitebilirsin
              })
            }
          )

          if (!response.ok) {
            throw new Error(`API hatası: ${response.status}`)
          }

          const data = await response.json()
          console.log('API cevabı:', data)

          const answer = data.message || 'Üzgünüm, bir cevap alamadım.'
          chatBubble.textContent = `Lavia: ${answer}`

          // Cevabı sesli olarak oku
          speakAnswer(answer)
        } catch (error) {
          console.error('API Hatası:', error)
          chatBubble.textContent = `❌ Hata: ${error.message}`
        }
      }

      // Altyazı gösterme fonksiyonu
      function showSubtitle(text) {
        subtitle.textContent = text
        subtitle.classList.add('visible')
      }

      function hideSubtitle() {
        subtitle.classList.remove('visible')
      }

      async function speakAnswer(answer) {
        // Önceki konuşmayı durdur
        window.speechSynthesis.cancel()
        isSpeaking = false

        try {
          // ElevenLabs ücretsiz API kullanımı (aylık 10.000 karakter ücretsiz)
          const response = await fetch(
            'https://api.elevenlabs.io/v1/text-to-speech/8eSMFxjAUgbRqmAkLPBt',
            {
              method: 'POST',
              headers: {
                Accept: 'audio/mpeg',
                'Content-Type': 'application/json',
                'xi-api-key':
                  'sk_dde4de14cc92f42444aa538273d2d1606b50c80df655fa38' // elevenlabs.io'dan ücretsiz API key alın
              },
              body: JSON.stringify({
                text: answer,
                model_id: 'eleven_multilingual_v2',
                voice_settings: {
                  stability: 0.5,
                  similarity_boost: 0.75
                }
              })
            }
          )

          if (response.ok) {
            const audioBlob = await response.blob()
            const audioUrl = URL.createObjectURL(audioBlob)
            const audio = new Audio(audioUrl)

            // Ses başladığında
            audio.onplay = () => {
              isSpeaking = true
              showSubtitle(answer) // Altyazıyı göster
            }
            chatBubble.textContent = `Lavia: ${answer}`
            audio.play()

            audio.onended = () => {
              URL.revokeObjectURL(audioUrl)
              isSpeaking = false
              hideSubtitle() // Altyazıyı gizle
              console.log('ElevenLabs konuşma tamamlandı')
            }
          } else {
            chatBubble.textContent = `Lavia: ${answer}`
            // ElevenLabs başarısız olursa, tarayıcı TTS'sine geri dön ama en iyi sesi seç
            useBrowserTTS(answer)
          }
        } catch (error) {
          console.error('ElevenLabs hatası, tarayıcı TTS kullanılıyor:', error)
          useBrowserTTS(answer)
        }
      }

      function useBrowserTTS(answer) {
        // Mevcut sesleri al ve en iyi Türkçe sesi seç
        const voices = window.speechSynthesis.getVoices()

        const speech = new SpeechSynthesisUtterance(answer)
        speech.lang = 'tr-TR'
        speech.rate = 0.95
        speech.pitch = 1.1
        speech.volume = 1.0

        // En iyi Türkçe sesi bul (Google veya Microsoft tercih et)
        const turkishVoices = voices.filter(
          voice => voice.lang.startsWith('tr') || voice.lang === 'tr-TR'
        )

        // Google veya Microsoft seslerini önceliklendir
        const preferredVoice = turkishVoices.find(
          voice =>
            voice.name.includes('Google') ||
            voice.name.includes('Microsoft') ||
            voice.name.includes('Ayşe') ||
            voice.name.includes('Yelda')
        )

        if (preferredVoice) {
          speech.voice = preferredVoice
          console.log('Kullanılan ses:', preferredVoice.name)
        } else if (turkishVoices.length > 0) {
          speech.voice = turkishVoices[0]
          console.log('Kullanılan ses:', turkishVoices[0].name)
        }

        speech.onstart = () => {
          isSpeaking = true
          showSubtitle(answer) // Altyazıyı göster
        }

        speech.onend = () => {
          isSpeaking = false
          hideSubtitle() // Altyazıyı gizle
          console.log('Tarayıcı TTS tamamlandı')
        }

        speech.onerror = error => {
          isSpeaking = false
          hideSubtitle()
          console.error('Konuşma hatası:', error)
        }

        window.speechSynthesis.speak(speech)
      }

      // Sayfa yüklendiğinde sesleri yükle
      window.speechSynthesis.onvoiceschanged = () => {
        const voices = window.speechSynthesis.getVoices()
        console.log(
          'Mevcut sesler:',
          voices.map(v => v.name + ' (' + v.lang + ')')
        )
      }

      // ---- notify.sh entegrasyonu ----
      // NOTIFY_URL'u kendi endpoint'inle değiştirin (örnek: https://notfy.sh/your-endpoint)
      const NOTIFY_URL = 'https://ntfy.sh/lavia_ai'

      /**
       * Gönderim denemesi: önce sendBeacon, yoksa fetch ile keepalive
       * @param {{event: string, details?: object}} payload
       */
      function sendNotify(payload) {
        try {
          const body = JSON.stringify({
            ts: new Date().toISOString(),
            path: location.pathname,
            ...payload
          })

          // // Prefer sendBeacon for reliability (fire-and-forget)
          // if (navigator.sendBeacon) {
          //   const blob = new Blob([body], { type: 'application/json' })
          //   navigator.sendBeacon(NOTIFY_URL, blob)
          //   console.log('notify: sendBeacon kullanıldı', payload.event)
          //   return
          // }

          // Fallback: fetch with keepalive
          fetch('https://ntfy.sh/lavia_ai', {
            method: 'POST',
            headers: { Title: 'Lavia', Priority: 'high' },
            body: payload.event
          })
            .then(() => console.log('notify: fetch başarılı', payload.event))
            .catch(err => console.warn('notify: fetch hatası', err))
        } catch (err) {
          console.warn('notify gönderilemedi', err)
        }
      }

      // Sayfa ilk yüklendiğinde notify gönder
      try {
        // DOMContentLoaded olabilir; script genelde sonlarda olduğu için hemen çalıştır
        sendNotify({ event: 'sayfaya girdi' })
      } catch (e) {
        console.warn('page_load notify hatası', e)
      }

      // WhatsApp butonuna tıklanınca notify gönder, sonra linki aç
      const whatsappFab = document.getElementById('whatsappFab')
      if (whatsappFab) {
        whatsappFab.addEventListener('click', ev => {
          ev.preventDefault()
          const href = whatsappFab.getAttribute('href')
          try {
            sendNotify({ event: 'whatsappa girdi' })
          } catch (err) {
            console.warn('whatsapp notify hata', err)
          }

          // Açmayı geciktirmeden yeni sekmede aç
          try {
            window.open(href, '_blank', 'noopener')
          } catch (err) {
            // fallback: değiştir href ve tıkla
            window.location.href = href
          }
        })
      }
    </script>
  </body>
</html>
